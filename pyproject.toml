[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidehouse"
dynamic = ["version"]
description = "Local-first HTML slide editor with cross-deck element reuse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Santiago Casas"}]
keywords = ["slides", "reveal.js", "editor", "presentations"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = []

[project.scripts]
slidehouse = "slidehouse.cli:main"

[tool.setuptools]
packages = ["slidehouse"]

[tool.setuptools.dynamic]
version = {attr = "slidehouse.__version__"}

[tool.setuptools.package-data]
slidehouse = ["web/*.html", "web/*.css", "web/js/*.js"]
