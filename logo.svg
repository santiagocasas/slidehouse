<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="SlideHouse logo">
  <title>SlideHouse</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5298"/>
      <stop offset="1" stop-color="#12284a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="copy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f06a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#12284a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(10,8)">
    <!-- Deck of slides peeking out behind the house -->
    <g filter="url(#shadow)">
      <rect x="40" y="146" width="160" height="90" rx="8" fill="#c9d8ee" stroke="#12284a" stroke-width="4" transform="rotate(-7 120 191)"/>
      <rect x="40" y="146" width="160" height="90" rx="8" fill="#dfe8f5" stroke="#12284a" stroke-width="4" transform="rotate(5 120 191)"/>
    </g>

    <!-- Chimney -->
    <rect x="176" y="40" width="26" height="52" rx="3" fill="#12284a"/>
    <rect x="171" y="34" width="36" height="12" rx="3" fill="#2a5298"/>

    <!-- House body = 16:9 slide -->
    <g filter="url(#shadow)">
      <rect x="46" y="120" width="164" height="92" rx="8" fill="url(#wall)" stroke="#12284a" stroke-width="7"/>
    </g>

    <!-- Roof -->
    <polygon points="14,126 128,26 242,126" fill="url(#roof)" stroke="#12284a" stroke-width="6" stroke-linejoin="round"/>
    <polyline points="40,118 128,41 216,118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Attic window / "play" button -->
    <circle cx="128" cy="90" r="17" fill="#ffffff" stroke="#f06a1f" stroke-width="5"/>
    <polygon points="122,81 122,99 138,90" fill="#f06a1f"/>

    <!-- Slide content: original element + pasted copy -->
    <rect x="66" y="138" width="44" height="44" rx="6" fill="none" stroke="#12284a" stroke-width="5" stroke-dasharray="7 5"/>
    <rect x="84" y="154" width="44" height="44" rx="6" fill="url(#copy)" stroke="#12284a" stroke-width="3"/>
    <!-- Text lines -->
    <line x1="148" y1="148" x2="192" y2="148" stroke="#12284a" stroke-width="6" stroke-linecap="round"/>
    <line x1="148" y1="164" x2="184" y2="164" stroke="#12284a" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <line x1="148" y1="178" x2="176" y2="178" stroke="#12284a" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <!-- Reveal.js-style progress bar -->
    <rect x="53" y="203" width="150" height="5" rx="2.5" fill="#12284a" opacity="0.15"/>
    <rect x="53" y="203" width="62" height="5" rx="2.5" fill="#f06a1f"/>
  </g>

  <!-- WORDMARK -->
  <text x="288" y="168" font-family="'Poppins','Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-2">
    <tspan fill="#12284a">Slide</tspan><tspan fill="#f06a1f">House</tspan>
  </text>
  <text x="292" y="206" font-family="'Poppins','Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="3" fill="#5b6b82">LOCAL-FIRST EDITOR FOR REVEAL.JS DECKS</text>
</svg>
